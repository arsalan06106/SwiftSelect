<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Floating Menu</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&display=swap"
    />
    <style>
      /* Base Variables & Reset */
      body {
        --c-glass: #bbbbbc;
        --c-light: #fff;
        --c-dark: #000;
        --c-content: #224;
        --c-action: #0052f5;
        --c-bg: #e8e8e9;
        --glass-reflex-dark: 1;
        --glass-reflex-light: 1;
        --saturation: 150%;

        font-size: 16px;
        font-family: "DM Sans", sans-serif;
        background: var(--c-bg);
        color: var(--c-content);
        margin: 0;
        min-height: 100vh;
        transition:
          background 400ms cubic-bezier(1, 0, 0.4, 1),
          color 400ms cubic-bezier(1, 0, 0.4, 1);
      }

      body.dark-theme {
        --c-glass: #bbbbbc;
        --c-light: #fff;
        --c-dark: #000;
        --c-content: #e1e1e1;
        --c-action: #03d5ff;
        --c-bg: #1b1b1d;
        --glass-reflex-dark: 2;
        --glass-reflex-light: 0.3;
        --saturation: 150%;
      }

      /* Floating Menu Container */
      .floating-menu {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;

        display: flex;
        align-items: center;
        padding: 12px 24px;
        gap: 16px;

        border-radius: 99em;

        /* Liquid Glass Effect using the NEW filter */
        background-color: color-mix(in srgb, var(--c-glass) 12%, transparent);
        backdrop-filter: blur(8px) url(#glass-blur) saturate(var(--saturation));
        -webkit-backdrop-filter: blur(8px) saturate(var(--saturation));
        box-shadow:
          inset 0 0 0 1px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 10%),
              transparent
            ),
          inset 1.8px 3px 0px -2px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 90%),
              transparent
            ),
          inset -2px -2px 0px -2px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 80%),
              transparent
            ),
          inset -3px -8px 1px -6px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 60%),
              transparent
            ),
          inset -0.3px -1px 4px 0px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 12%),
              transparent
            ),
          inset -1.5px 2.5px 0px -2px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 20%),
              transparent
            ),
          inset 0px 3px 4px -2px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 20%),
              transparent
            ),
          inset 2px -6.5px 1px -4px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 10%),
              transparent
            ),
          0px 1px 5px 0px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 10%),
              transparent
            ),
          0px 6px 16px 0px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 8%),
              transparent
            );

        transition:
          background-color 400ms ease,
          box-shadow 400ms ease;
      }

      /* Buttons */
      .glass-btn,
      .theme-toggle {
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        font-weight: 500;
        font-size: 1rem;
        /* Using the Reference File's Liquid Bezier */
        transition:
          transform 0.4s cubic-bezier(0.5, 1.5, 0.5, 1),
          background-color 0.3s ease,
          box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
        border-radius: 99em;
        padding: 14px 24px;
        user-select: none;
      }

      .glass-btn.circle,
      .theme-toggle {
        padding: 0;
        width: 52px;
        height: 52px;
        border-radius: 50%;
      }

      /* White Glass Variant */
      .glass-btn.white {
        background-color: color-mix(in srgb, var(--c-glass) 36%, transparent);
        color: var(--c-content);
        box-shadow:
          inset 0 0 0 1px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 10%),
              transparent
            ),
          inset 2px 1px 0px -1px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 90%),
              transparent
            ),
          inset -1.5px -1px 0px -1px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 80%),
              transparent
            ),
          inset -2px -6px 1px -5px
            color-mix(
              in srgb,
              var(--c-light) calc(var(--glass-reflex-light) * 60%),
              transparent
            ),
          inset -1px 2px 3px -1px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 20%),
              transparent
            ),
          inset 0px -4px 1px -2px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 10%),
              transparent
            ),
          0px 3px 6px 0px
            color-mix(
              in srgb,
              var(--c-dark) calc(var(--glass-reflex-dark) * 8%),
              transparent
            );
      }

      /* Black Glass Variant */
      .glass-btn.black {
        background-color: var(--c-content);
        color: var(--c-bg);
        box-shadow:
          inset 0 0 0 1px color-mix(in srgb, var(--c-light) 10%, transparent),
          inset 0 2px 4px rgba(255, 255, 255, 0.2),
          0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .theme-toggle {
        background: transparent;
        color: var(--c-content);
      }
      .theme-toggle:hover {
        background-color: color-mix(in srgb, var(--c-glass) 20%, transparent);
      }

      .glass-btn:hover {
        transform: scale(1.05); /* This also uses the spring bezier now */
      }
      .glass-btn.white:hover {
        background-color: color-mix(in srgb, var(--c-glass) 50%, transparent);
      }
      .glass-btn.black:hover {
        box-shadow:
          inset 0 0 0 1px color-mix(in srgb, var(--c-light) 20%, transparent),
          inset 0 3px 6px rgba(255, 255, 255, 0.4),
          0 6px 12px rgba(0, 0, 0, 0.4);
      }

      /* Active State for 'Liquid' compress */
      .glass-btn:active,
      .glass-btn.is-clicking {
        transform: scale(0.9);
        transition: transform 0.1s ease-out; /* Fast compress */
      }
    </style>
  </head>
  <body>
    <nav class="floating-menu">
      <button class="glass-btn pill white" title="Visible Area">
        <!-- Eye Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <span>Visible Area</span>
      </button>

      <button class="glass-btn circle white" title="Download">
        <!-- Download Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" x2="12" y1="15" y2="3" />
        </svg>
      </button>

      <button class="glass-btn pill white" title="Full Page">
        <!-- Crop/Full Page Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 5a2 2 0 0 1 2-2h4a1 1 0 0 1 0 2H5v4a1 1 0 0 1-2 0V5z" />
          <path d="M21 5a2 2 0 0 0-2-2h-4a1 1 0 0 0 0 2h4v4a1 1 0 0 0 2 0V5z" />
          <path d="M3 19a2 2 0 0 0 2 2h4a1 1 0 0 0 0-2H5v-4a1 1 0 0 0-2 0v4z" />
          <path
            d="M21 19a2 2 0 0 1-2 2h-4a1 1 0 0 1 0-2h4v-4a1 1 0 0 1 2 0v4z"
          />
          <rect x="7" y="9" width="10" height="6" rx="1" />
        </svg>
        <span>Full Page</span>
      </button>

      <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
        <!-- Sun Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="sun-icon"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
        <!-- Moon Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="moon-icon"
          style="display: none"
        >
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>
    </nav>

    <!-- NEW SVG Filters from Reference (Turbulence) -->
    <svg
      style="
        position: absolute;
        width: 0;
        height: 0;
        z-index: -1;
        pointer-events: none;
      "
    >
      <filter
        id="glass-blur"
        x="0"
        y="0"
        width="100%"
        height="100%"
        filterUnits="objectBoundingBox"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.003 0.007"
          numOctaves="1"
          result="turbulence"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="turbulence"
          scale="200"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>

    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const sunIcon = document.querySelector(".sun-icon");
      const moonIcon = document.querySelector(".moon-icon");
      const body = document.body;
      const allButtons = document.querySelectorAll("button");

      themeToggle.addEventListener("click", () => {
        body.classList.toggle("dark-theme");
        const isDark = body.classList.contains("dark-theme");
        sunIcon.style.display = isDark ? "none" : "block";
        moonIcon.style.display = isDark ? "block" : "none";
      });

      allButtons.forEach((btn) => {
        btn.addEventListener("click", function () {
          // JS triggers the fast compress
          this.classList.add("is-clicking");

          // And releases it quickly to allow the spring bezier to take over
          setTimeout(() => {
            this.classList.remove("is-clicking");
          }, 150);
        });
      });
    </script>
  </body>
</html>
